name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -mod=readonly ./...
      - name: Build linux/amd64 and windows/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -mod=readonly -trimpath -o "$RUNNER_TEMP/agent-bot" ./cmd/agent-bot
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -mod=readonly -trimpath -o "$RUNNER_TEMP/agent-bot.exe" ./cmd/agent-bot
